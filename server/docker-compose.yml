services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: noc_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "max_connections=30"]
    mem_limit: 256m
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: noc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: noc_neo4j
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: noc_rabbitmq
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "5672:5672" # AMQP protocol
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  mock-source:
    build:
      context: ../mock-source
    container_name: noc_mock_source
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "8001:8000" # Mock external REST source: GET /events?since=..., GET /health
    environment:
      MOCK_DEVICE_ID: ${MOCK_DEVICE_ID:-CORE-01}
      MOCK_GENERATE_INTERVAL_SECONDS: ${MOCK_GENERATE_INTERVAL_SECONDS:-5}
      MOCK_ALARM_EVERY: ${MOCK_ALARM_EVERY:-3}
      MOCK_API_KEY: ${MOCK_API_KEY:-noc-mock-dev-key}

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  rabbitmq_data:

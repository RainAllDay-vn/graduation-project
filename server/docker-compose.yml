services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: noc_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: noc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: noc_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: noc_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP protocol
      - "15672:15672" # RabbitMQ Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  mock-source:
    build:
      context: ../mock-source
    container_name: noc_mock_source
    restart: unless-stopped
    ports:
      - "8001:8000" # Mock external REST source: GET /events?since=..., GET /health
    environment:
      MOCK_DEVICE_ID: ${MOCK_DEVICE_ID:-CORE-01}
      MOCK_GENERATE_INTERVAL_SECONDS: ${MOCK_GENERATE_INTERVAL_SECONDS:-5}
      MOCK_ALARM_EVERY: ${MOCK_ALARM_EVERY:-3}
      MOCK_API_KEY: ${MOCK_API_KEY:-noc-mock-dev-key}

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  rabbitmq_data:

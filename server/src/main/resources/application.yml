server:
  port: 8080

spring:
  application:
    name: noc-server
  profiles:
    default: dev

  # File uploads (Document Management)
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

  # PostgreSQL + JPA (Alarms, Telemetry, Incidents, Documents)
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/noc_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Neo4j (Topology & Dependency Graph)
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:password123}

  # RabbitMQ (one-way sync from message-queue sources)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        missing-queues-fatal: false
        default-requeue-rejected: false

  # Spring AI & Vector Store
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
    vectorstore:
      pgvector:
        table-name: technical_doc_embeddings
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: true

# Monitoring & Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# App custom settings
app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:5173"
      - "http://127.0.0.1:3000"
  documents:
    storage-dir: ${DOCUMENTS_STORAGE_DIR:./data/documents}
    max-file-size: 100MB
  sources:
    sync:
      simulated: true
    connect-timeout-seconds: 5
    scheduler:
      enabled: false
    max-auto-retries: 5

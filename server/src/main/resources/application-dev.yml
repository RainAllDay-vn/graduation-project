# Development Profile Configuration
spring:
  ai:
    model:
      embedding: none
    vectorstore:
      type: none

app:
  rag:
    indexing-enabled: false
  sources:
    sync:
      simulated: false
    scheduler:
      enabled: true
      scan-interval-ms: 1000

logging:
  level:
    com.gr2.noc: DEBUG
    org.springframework.web: INFO

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>HÌNH 4.1B — Tìm kiếm: đã chọn</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #070a10; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .wrap { width: 960px; height: 560px; display: flex; flex-direction: column; }
  .main { flex: 1; position: relative; display: flex; padding: 24px 24px 12px; min-height: 0; }

  .card { width: 330px; flex: none; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 16px; align-self: flex-start; }
  .c-head { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: #94a3b8; margin-bottom: 12px; }
  .search { height: 34px; background: #1e293b; border: 1px solid #475569; border-radius: 7px; display: flex; align-items: center; padding: 0 10px; font-size: 12.5px; font-weight: 700; color: #e2e8f0; letter-spacing: 1px; }
  .caret { width: 1.5px; height: 15px; background: #e2e8f0; display: inline-block; margin-left: 1px; }
  .drop { margin-top: 8px; background: #0b111e; border: 1px solid #334155; border-radius: 8px; padding: 6px 0; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 9px; padding: 7px 12px; font-size: 11.5px; color: #cbd5e1; }
  .row i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .row .id { font-weight: 700; color: #e2e8f0; letter-spacing: 0.5px; }
  .row .site { margin-left: auto; font-size: 9.5px; color: #64748b; letter-spacing: 0.5px; }
  .row.sel { background: #1e293b; border-left: 3px solid #e2e8f0; padding-left: 9px; }

  .canvas { flex: 1; position: relative; background: #070a10; border: 1px solid #1e293b; border-radius: 10px; margin-left: 18px; overflow: hidden; }
  .canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .c-label { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-size: 10.5px; font-weight: 800; letter-spacing: 1.5px; color: #94a3b8; }

  .note { height: 40px; flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; border-top: 1px solid #1e293b; background: #0b111e; font-size: 11px; }
  .note .n1 { font-weight: 800; color: #e2e8f0; letter-spacing: 0.8px; }
  .note .n3 { color: #94a3b8; }
</style>
</head>
<body>
<div class="wrap">

  <div class="main">

    <div class="card">
      <div class="c-head">SIDEBAR TRÁI · 4.1</div>
      <div class="search"><span>CORE</span><span class="caret"></span></div>
      <div class="drop">
        <div class="row"><i style="background:#10b981"></i><span class="id">CORE-01</span><span class="site">SITE-1</span></div>
        <div class="row sel"><i style="background:#ef4444"></i><span class="id">CORE-02</span><span class="site">SITE-2</span></div>
        <div class="row"><i style="background:#10b981"></i><span class="id">CORE-03</span><span class="site">SITE-2</span></div>
      </div>
    </div>

    <div class="canvas">
      <svg viewBox="0 0 562 480" preserveAspectRatio="none" aria-hidden="true">

          <line x1="281" y1="96" x2="225" y2="216" stroke="#ef4444"/>
          <line x1="281" y1="96" x2="355" y2="216" stroke="#10b981"/>
          <line x1="225" y1="216" x2="190" y2="336" stroke="#10b981"/>
          <line x1="225" y1="216" x2="295" y2="336" stroke="#10b981"/>
          <line x1="355" y1="216" x2="400" y2="336" stroke="#10b981"/>
        </g>
        <g font-family="ui-monospace, monospace" font-size="7" font-weight="800" text-anchor="middle">
          <g opacity="0.22">
            <rect x="112" y="84" width="36" height="24" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>

            <rect x="77" y="204" width="36" height="24" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
            <text x="95" y="219" fill="#e2e8f0">AGG-01</text>
            <rect x="462" y="204" width="36" height="24" rx="5" fill="#0f172a" stroke="#facc15" stroke-width="1.4"/>
            <text x="480" y="219" fill="#e2e8f0">AGG-04</text>
            <rect x="67" y="324" width="36" height="24" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
            <text x="85" y="339" fill="#e2e8f0">EXCH-01</text>
            <rect x="472" y="324" width="36" height="24" rx="5" fill="#0f172a" stroke="#facc15" stroke-width="1.4"/>
            <text x="490" y="339" fill="#e2e8f0">EXCH-05</text>
          </g>
          <rect x="263" y="84" width="36" height="24" rx="5" fill="#991b1b" stroke="#a78bfa" stroke-width="1.8"/>
          <text x="281" y="99" fill="#ffffff">CORE-02</text>
          <rect x="337" y="204" width="36" height="24" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1.4"/>
          <text x="355" y="219" fill="#e2e8f0">AGG-03</text>
          <rect x="172" y="324" width="36" height="24" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1.4"/>
          <text x="190" y="339" fill="#e2e8f0">EXCH-02</text>
          <rect x="277" y="324" width="36" height="24" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1.4"/>
          <text x="295" y="339" fill="#e2e8f0">EXCH-03</text>
          <rect x="382" y="324" width="36" height="24" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1.4"/>
          <text x="400" y="339" fill="#e2e8f0">EXCH-04</text>
          <rect x="207" y="204" width="36" height="24" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1.4"/>
          <text x="225" y="219" fill="#e2e8f0">AGG-02</text>
        </g>
        <circle cx="281" cy="96" r="30" fill="none" stroke="#e2e8f0" stroke-width="2"/>
       </g>
      </svg>
      <div class="c-label">CANVAS — SAU KHI CHỌN</div>
    </div>

  </div>

  <div class="note">
    <span class="n1">TÌM KIẾM</span>
    <span class="n3">— chọn kết quả → canvas pan về node + focus</span>
  </div>

</div>
</body>
</html>
